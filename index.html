<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trims QA Enterprise Portal</title>
    
    <!-- Separate External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="login-card">
            <h2>Trims QA Portal</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Sign in to your account</p>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" id="login-email" required placeholder="username or email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In</button>
            </form>
            <div id="login-error" style="color: var(--danger); font-size: 12px; margin-top: 12px;"></div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen">
        <div class="container">
            
            <div class="brand-banner">
                <img class="brand-logo" src="92806_2.jpg" alt="STAR - A Komar company">
            </div>

            <!-- Navbar -->
            <div class="navbar">
                <div style="font-size: 18px; font-weight: 600;">QA Operations Dashboard</div>
                
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div class="user-nav-profile">
                        <img id="nav-avatar" class="avatar" src="https://via.placeholder.com/150" alt="Profile">
                        <div>
                            <span id="nav-username" style="font-size: 13px; font-weight: 600; display: block;">User</span>
                            <span id="nav-role" style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Operator</span>
                        </div>
                    </div>
                    <button class="btn btn-danger no-print" onclick="handleLogout()" style="padding: 6px 12px; font-size: 11px;">Logout</button>
                </div>
            </div>

            <!-- 👑 MASTER DASHBOARD PANEL -->
            <div id="master-admin-panel" class="admin-panel no-print" style="display: none;">
                <h3 style="margin-bottom: 15px; color: var(--primary);">👑 Master Dashboard Control</h3>
                
                <div class="grid-2">
                    <!-- Register New Operator -->
                    <div class="card">
                        <h4 style="font-size: 13px; margin-bottom: 10px;">Register New Operator</h4>
                        <form onsubmit="handleCreateUser(event)">
                            <div class="form-group">
                                <label>Operator Name</label>
                                <input type="text" id="new-user-name" required placeholder="Full Name">
                            </div>
                            <div class="form-group">
                                <label>Username (or Email)</label>
                                <input type="text" id="new-user-email" required placeholder="username">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="new-user-pass" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-success">Register Operator</button>
                        </form>
                        <div id="reg-msg" style="font-size: 11px; margin-top: 5px;"></div>
                    </div>

                    <!-- User Filter & Management -->
                    <div class="card">
                        <h4 style="font-size: 13px; margin-bottom: 10px;">Filter PO Logs By Registered User</h4>
                        <div class="form-group">
                            <label>Select User to View Sheet:</label>
                            <select id="master-user-select" onchange="loadData()">
                                <option value="ALL">Show All Users Data</option>
                            </select>
                        </div>
                        <h4 style="font-size: 12px; margin-top: 15px; margin-bottom: 5px;">Registered System Users List:</h4>
                        <div style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 5px;">
                            <ul id="users-list" style="list-style: none; font-size: 12px;"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid-main">
                <!-- Data Entry Form -->
                <div class="card no-print">
                    <h3 style="font-size: 14px; text-transform: uppercase; margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 8px;">Log Inspection Record</h3>
                    <form onsubmit="handleSaveRecord(event)">
                        <div class="form-group">
                            <label>PO Number</label>
                            <input type="text" id="poNumber" required placeholder="PO-XXXX">
                        </div>
                        <div class="form-group">
                            <label>Article Specs</label>
                            <input type="text" id="articleDetails" required placeholder="Details">
                        </div>
                        <div class="form-group">
                            <label>Color</label>
                            <input type="text" id="color" required placeholder="Color">
                        </div>
                        <div class="form-group">
                            <label>Total Batch Qty</label>
                            <input type="number" id="totalQty" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Inspection Status</label>
                            <select id="status">
                                <option value="OK">OK</option>
                                <option value="HOLD">HOLD</option>
                                <option value="REJECT">REJECT</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Entry</button>
                    </form>
                </div>

                <!-- Inspection Logs Sheet Display -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;" class="no-print">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <label style="font-size: 12px; font-weight: 600;">Select Date:</label>
                            <input type="date" id="filterDate" onchange="loadData()" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">
                        </div>
                        <button class="btn btn-secondary" onclick="window.print()">Print PDF Report</button>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Logged By (User)</th>
                                    <th>Date / Time</th>
                                    <th>PO Number</th>
                                    <th>Article Specs</th>
                                    <th>Color</th>
                                    <th>Qty</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Separate External JS Files (In Order) -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
